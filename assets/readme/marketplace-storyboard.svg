<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">N5Deal marketplace reviewer storyboard</title>
  <desc id="desc">Three connected views: a buyer mandate, an explainable asset match, and manager moderation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1400" cy="-40" r="300" fill="#2563eb" opacity=".18"/>
  <text x="88" y="104" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">N5DEAL / REVIEWER STORYBOARD</text>
  <text x="88" y="170" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="750">From mandate to meaningful contact.</text>
  <text x="88" y="212" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="22">A small, persistent marketplace prototype with decisions you can inspect.</text>
  <g filter="url(#shadow)"><rect x="88" y="292" width="430" height="340" rx="24" fill="#f8fafc"/><rect x="585" y="292" width="430" height="340" rx="24" fill="#f8fafc"/><rect x="1082" y="292" width="430" height="340" rx="24" fill="#f8fafc"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="122" y="338" fill="#2563eb" font-size="16" font-weight="800" letter-spacing="2">01 / BUYER</text><text x="122" y="382" fill="#0f172a" font-size="30" font-weight="750">Acquisition mandate</text><text x="122" y="420" fill="#64748b" font-size="17">Sector · Geography · Ticket size</text><rect x="122" y="456" width="362" height="14" rx="7" fill="#dbeafe"/><rect x="122" y="456" width="284" height="14" rx="7" fill="#2563eb"/><text x="122" y="530" fill="#334155" font-size="18" font-weight="650">Profile saved</text><text x="122" y="560" fill="#64748b" font-size="16">Ready to discover relevant assets.</text>
    <text x="619" y="338" fill="#2563eb" font-size="16" font-weight="800" letter-spacing="2">02 / MATCH</text><text x="619" y="382" fill="#0f172a" font-size="30" font-weight="750">Explainable fit</text><rect x="619" y="424" width="362" height="92" rx="16" fill="#eff6ff"/><text x="643" y="466" fill="#1d4ed8" font-size="34" font-weight="800">87%</text><text x="643" y="494" fill="#475569" font-size="15">strong fit · 3 reasons</text><text x="619" y="560" fill="#334155" font-size="18" font-weight="650">Contact Seller</text>
    <text x="1116" y="338" fill="#2563eb" font-size="16" font-weight="800" letter-spacing="2">03 / CONTROL</text><text x="1116" y="382" fill="#0f172a" font-size="30" font-weight="750">Manager moderation</text><rect x="1116" y="424" width="362" height="58" rx="14" fill="#f1f5f9"/><circle cx="1148" cy="453" r="12" fill="#22c55e"/><text x="1172" y="460" fill="#334155" font-size="17" font-weight="650">Preview impact before action</text><text x="1116" y="560" fill="#334155" font-size="18" font-weight="650">Suspend · restore · audit</text>
  </g>
  <path d="M530 462h38m-11-10 11 10-11 10M1027 462h38m-11-10 11 10-11 10" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
