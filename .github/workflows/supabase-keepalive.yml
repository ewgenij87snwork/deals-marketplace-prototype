name: Supabase keepalive

on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Touch database-backed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(
            --fail
            --show-error
            --silent
            --max-time 30
            --retry 3
            --retry-delay 10
            --retry-all-errors
          )
          url="https://deals-marketplace-prototype.vercel.app/api/health"
          body="$(curl "${curl_args[@]}" "$url")"
          printf '%s\n' "$body"
          python3 - "$body" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get('status') != 'ok' or payload.get('database') != 'reachable':
              raise SystemExit(f"unexpected health payload: {payload}")
          PY
